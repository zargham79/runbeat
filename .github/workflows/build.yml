name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q RunBeat.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: echo "jamendo.client.id=${{ secrets.JAMENDO_CLIENT_ID }}" > RunBeat/local.properties
      - run: gradle assembleDebug --no-daemon
        working-directory: RunBeat
      - uses: actions/upload-artifact@v4
        with:
          name: RunBeat-apk
          path: RunBeat/app/build/outputs/apk/debug/app-debug.apk
